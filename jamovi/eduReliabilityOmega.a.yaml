---
name: eduReliabilityOmega
title: "Guided Reliability: Omega and Alpha"
menuGroup: jReport
version: '1.0.0'
jas: '1.2'
description:
    references:
        - jReport
        - psych
        - McDonald1999
        - RevelleCondon2019
        - ggplot2
    main: >
        Estimate and report internal consistency using McDonald's omega total
        and Cronbach's alpha, with item diagnostics and clear interpretation
        guidance.
options:
    - { name: data, type: Data }
    - name: items
      title: Scale items
      type: Variables
      suggested: [continuous, ordinal]
      permitted: [numeric]
    - name: reverseItems
      title: Reverse-keyed items
      type: Variables
      suggested: [continuous, ordinal]
      permitted: [numeric]
      default: []
    - name: correlationType
      title: Item correlation type
      type: List
      options:
        - { name: pearson, title: Pearson correlations }
        - { name: polychoric, title: Polychoric correlations for ordinal items }
      default: pearson
    - { name: bootstrapCI, title: Bootstrap confidence interval, type: Bool, default: true }
    - { name: bootstrapSamples, title: Bootstrap resamples, type: Number, min: 20, max: 5000, default: 200 }
    - { name: ciWidth, title: Confidence level, type: Number, min: 50, max: 99.9, default: 95 }
    - { name: showPlot, title: Item-quality visualisation, type: Bool, default: true }
    - name: reportStyle
      title: Report style
      type: List
      options:
        - { name: apa7, title: APA 7th edition }
        - { name: plain, title: Plain English / teaching explanation }
        - { name: journal, title: Journal style }
        - { name: dissertation, title: Dissertation style }
      default: apa7
    - name: reportFormat
      title: Report format
      type: List
      options:
        - { name: short, title: Short APA sentence }
        - { name: paragraph, title: Full results paragraph }
        - { name: bullets, title: Bullet-point interpretation }
        - { name: table_paragraph, title: Table plus paragraph }
        - { name: copy_ready, title: Copy-ready report block }
      default: paragraph
    - name: reportTone
      title: Tone of explanation
      type: List
      options:
        - { name: concise, title: Concise }
        - { name: student_friendly, title: Student-friendly }
        - { name: detailed, title: Detailed }
        - { name: critical, title: Critical / publication-focused }
      default: student_friendly
    - { name: reportDescriptives, title: Scale and sample description, type: Bool, default: true }
    - { name: reportAssumptions, title: Item and data-quality guidance, type: Bool, default: true }
    - { name: reportEffect, title: Omega estimate, type: Bool, default: true }
    - { name: reportCI, title: Confidence interval, type: Bool, default: true }
    - { name: reportInterpretation, title: Interpretation of reliability, type: Bool, default: true }
    - { name: reportCautions, title: Cautions or scoring warnings, type: Bool, default: true }
...
