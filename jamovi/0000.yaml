description: >
  Guided analyses with assumption diagnostics, effect sizes, visualisations, and
  selectable APA-style or teaching-oriented interpretation.
analyses:
  - title: Guided T-Test
    name: eduTTest
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: T-Test
    hidden: true
    description: >
      Compare two means while explaining test selection, assumptions, effect
      size, and reporting in accessible language.
    category: analyses
  - title: Guided Independent Samples t-test
    name: eduTTestIndependent
    ns: jReport
    category: analyses
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: Independent Samples t-test
    description: >
      Compare two independent group means while explaining assumptions, effect
      size, and reporting in accessible language.
  - title: Guided Paired Samples t-test
    name: eduTTestPaired
    ns: jReport
    category: analyses
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: Paired Samples t-test
    description: >
      Compare two paired measurements while explaining assumptions, effect size,
      and reporting in accessible language.
  - title: Guided One-Way ANOVA
    name: eduAnova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: One-Way ANOVA
    description: >
      Compare means across three or more independent groups with effect sizes,
      assumption guidance, and report-ready explanation.
    category: analyses
  - title: Guided Correlation
    name: eduCorrelation
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Association
    menuTitle: Correlation
    description: >
      Explain the direction, strength, assumptions, and reporting of an
      association between two numeric variables.
    category: analyses
  - title: Guided Chi-Square Test of Independence
    name: eduChiSquareIndependence
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Frequencies
    menuTitle: Chi-Square Independence
    description: >
      Assess whether two categorical variables are associated, with expected
      count checks, Cramer's V, and report-ready explanation.
    category: analyses
  - title: Guided Chi-Square Goodness-of-Fit
    name: eduChiSquareGoodness
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Frequencies
    menuTitle: Chi-Square Goodness-of-Fit
    description: >
      Compare observed categorical frequencies with an expected distribution,
      with assumption guidance and report-ready explanation.
    category: analyses
  - title: Guided Linear Regression
    name: eduRegression
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Regression
    menuTitle: Linear Regression
    description: >
      Model a numeric outcome using one or more numeric predictors with model
      fit, coefficients, diagnostic guidance, and interpretable reporting.
    category: analyses
  - title: Guided Binomial Logistic Regression
    name: eduLogistic
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Regression
    menuTitle: Binomial Logistic
    description: >
      Model a binary outcome using numeric or categorical predictors with odds
