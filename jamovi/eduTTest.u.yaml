---
name: eduTTest
title: Guided T-Test
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariablesListBox
    name: outcome
    label: Outcome
    maxItemCount: 1
    isTarget: true
    suggested: [continuous]
  - type: VariablesListBox
    name: group
    label: Grouping Variable
    maxItemCount: 1
    isTarget: true
    suggested: [nominal, ordinal]
  - type: VariablesListBox
    name: pairedOutcome
    label: Second Paired Measurement
    maxItemCount: 1
    isTarget: true
    suggested: [continuous]
  - type: CollapseBox
    label: Analysis
    collapsed: false
    children:
      - { type: ComboBox, name: testType }
      - { type: CheckBox, name: varEqual }
      - { type: TextBox, name: ciWidth, format: number }
      - { type: CheckBox, name: showPlot }
  - type: CollapseBox
    label: Reporting
    collapsed: true
    children:
      - { type: ComboBox, name: reportStyle }
      - { type: ComboBox, name: reportFormat }
      - { type: ComboBox, name: reportTone }
      - { type: CheckBox, name: reportDescriptives }
      - { type: CheckBox, name: reportAssumptions }
      - { type: CheckBox, name: reportStatistic }
      - { type: CheckBox, name: reportDf }
      - { type: CheckBox, name: reportP }
      - { type: CheckBox, name: reportEffect }
      - { type: CheckBox, name: reportCI }
      - { type: CheckBox, name: reportInterpretation }
      - { type: CheckBox, name: reportCautions }
...
