---
name: eduDemographics
title: Demographic Table
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    stretchFactor: 1
    persistentItems: true
    children:
      - type: TargetLayoutBox
        label: Table Variables
        children:
          - type: VariablesListBox
            name: tableVariables
            isTarget: true
      - type: TargetLayoutBox
        label: Paragraph Variables
        children:
          - type: VariablesListBox
            name: paragraphVariables
            isTarget: true
  - type: CollapseBox
    label: Output Options
    collapsed: false
    children:
      - { type: CheckBox, name: showTable }
      - { type: CheckBox, name: showParagraph }
      - { type: TextBox, name: tableTitle }
  - type: CollapseBox
    label: Continuous Variable Statistics
    collapsed: false
    children:
      - { type: CheckBox, name: statMean }
      - { type: CheckBox, name: statSD }
      - { type: CheckBox, name: statMedian }
      - { type: CheckBox, name: statIQR }
      - { type: CheckBox, name: statMin }
      - { type: CheckBox, name: statMax }
      - { type: CheckBox, name: statRange }
      - { type: CheckBox, name: statContMissing }
  - type: CollapseBox
    label: Categorical Variable Statistics
    collapsed: false
    children:
      - { type: CheckBox, name: statN }
      - { type: CheckBox, name: statPct }
      - { type: CheckBox, name: statCatMissing }
  - type: CollapseBox
    label: Additional Table Rows
    collapsed: true
    children:
      - { type: TextBox, name: customRow1Char }
      - { type: TextBox, name: customRow1Val }
      - { type: TextBox, name: customRow1Pct }
      - { type: TextBox, name: customRow1Note }
      - { type: TextBox, name: customRow2Char }
      - { type: TextBox, name: customRow2Val }
      - { type: TextBox, name: customRow2Pct }
      - { type: TextBox, name: customRow2Note }
      - { type: TextBox, name: customRow3Char }
      - { type: TextBox, name: customRow3Val }
      - { type: TextBox, name: customRow3Pct }
      - { type: TextBox, name: customRow3Note }
      - { type: TextBox, name: customRow4Char }
      - { type: TextBox, name: customRow4Val }
      - { type: TextBox, name: customRow4Pct }
      - { type: TextBox, name: customRow4Note }
      - { type: TextBox, name: customRow5Char }
      - { type: TextBox, name: customRow5Val }
      - { type: TextBox, name: customRow5Pct }
      - { type: TextBox, name: customRow5Note }
  - type: CollapseBox
    label: Reporting
    collapsed: true
    children:
      - { type: CheckBox, name: showOmitNote }
      - { type: CheckBox, name: showBestPractices }
...
