    category: analyses
  - title: Guided Multinomial Logistic Regression
    name: eduMultinomialLogistic
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Regression
    menuTitle: Multinomial Logistic
    description: >
      Model a nominal outcome with 3 or more categories using numeric or
      categorical predictors with relative risk ratios, model-fit explanation,
      and reporting guidance.
    category: analyses
  - title: Guided Between-Subjects ANOVA
    name: eduBetweenAnova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: Between-Subjects ANOVA
    description: >
      Examine mean differences across one or more independent categorical
      factors, prioritising interaction interpretation when appropriate.
    category: analyses
  - title: Guided Repeated-Measures ANOVA
    name: eduRMAnova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Repeated Measures
    menuTitle: Repeated-Measures ANOVA
    description: >
      Compare repeated measurements from the same participants and explain
      sphericity and Greenhouse-Geisser-corrected inference.
    category: analyses
  - title: Guided Mixed ANOVA
    name: eduMixedAnova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Repeated Measures
    menuTitle: Mixed ANOVA
    description: >
      Examine repeated change, between-group differences, and their interaction
      with sphericity-aware reporting.
    category: analyses
  - title: Guided ANCOVA
    name: eduAncova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: ANCOVA
    description: >
      Compare adjusted group means while explicitly checking whether
      covariate-outcome slopes are comparable across groups.
    category: analyses
  - title: Guided MANOVA / MANCOVA
    name: eduMancova
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Group Comparisons
    menuTitle: MANOVA / MANCOVA
    description: >
      Test whether two or more dependent variables jointly vary across
      categorical factors and optional numeric covariates. Significant Pillai
      omnibus effects are followed by Holm-adjusted univariate ANOVA/ANCOVA
      summaries for each dependent variable.
    category: analyses
  - title: 'Guided Reliability: Omega and Alpha'
    name: eduReliabilityOmega
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Psychometrics
    menuTitle: Reliability
    description: >
      Estimate and report internal consistency using McDonald's omega total and
      Cronbach's alpha, with item diagnostics and clear interpretation guidance.
    category: analyses
  - title: Demographic Table
    name: eduDemographics
    ns: jReport
    menuGroup: jReport
    menuSubgroup: Descriptives
    menuTitle: Demographics
    description: >
