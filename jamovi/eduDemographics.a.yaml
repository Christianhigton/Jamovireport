---
name: eduDemographics
title: Demographic Table
menuGroup: jReport
version: '1.0.0'
jas: '1.2'
description:
    main: >
        Produce an APA-style demographic characteristics table directly
        copyable into Word. Categorical variables show n and % per
        category; continuous variables show M, SD, and range. Custom
        rows can be added manually.
    references:
        - jReport
        - RCore
options:
    - { name: data, type: Data }
    - name: variables
      title: Variables
      type: Variables
      suggested: [nominal, ordinal, continuous]
      permitted: [factor, numeric]
      default: null
    - name: tableTitle
      title: Table title
      type: String
      default: "Table 1. Demographic Characteristics of the Sample"
    - name: includeParagraph
      title: APA descriptive paragraph
      type: Bool
      default: true
    - name: includeCustomInParagraph
      title: Custom rows in APA paragraph
      type: Bool
      default: false
    - name: customRow1Var
      title: "Row 1: Variable"
      type: String
      default: ""
    - name: customRow1Cat
      title: "Row 1: Category or statistic"
      type: String
      default: ""
    - name: customRow1N
      title: "Row 1: n or value"
      type: String
      default: ""
    - name: customRow1Pct
      title: "Row 1: %"
      type: String
      default: ""
    - name: customRow1Note
      title: "Row 1: Note"
      type: String
      default: ""
