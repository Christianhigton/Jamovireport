---
name: jrReportTTestIS
title: Automatic Report for Independent Samples T-Test
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: 'jReport: Reporting and explanation'
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - { type: CheckBox, name: jreportEnabled }
          - { type: ComboBox, name: reportStyle, enable: (jreportEnabled) }
          - { type: ComboBox, name: explanationTone, enable: (jreportEnabled) }
          - type: Label
            label: 'Include in output'
            children:
              - { type: CheckBox, name: showSuggestedWording, enable: (jreportEnabled) }
              - { type: CheckBox, name: showInterpretation, enable: (jreportEnabled) }
              - { type: CheckBox, name: showEffectSizeGuidance, enable: (jreportEnabled) }
              - { type: CheckBox, name: showAssumptionGuidance, enable: (jreportEnabled) }
              - { type: CheckBox, name: showPracticalMeaning, enable: (jreportEnabled) }
              - { type: CheckBox, name: showCheckBeforeReporting, enable: (jreportEnabled) }
              - { type: CheckBox, name: showReferences, enable: (jreportEnabled) }
          - type: Label
            label: 'When reporting several related outcomes'
            children:
              - { type: ComboBox, name: pAdjustment, enable: (jreportEnabled) }
...
