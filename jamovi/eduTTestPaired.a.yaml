---
name: eduTTestPaired
title: Guided Paired Samples t-test
menuGroup: jReport
menuSubgroup: Group Comparisons
menuTitle: Paired Samples t-test
version: '1.0.0'
jas: '1.2'
description:
    references:
        - jReport
        - effectsize
        - ggplot2
        - BayesFactor
    main: >
        Compare two paired measurements while explaining assumptions, effect
        size, and reporting in accessible language.
options:
    - name: data
      type: Data
    - name: outcome
      title: First measurement
      type: Variable
      suggested: [continuous]
      permitted: [numeric]
    - name: pairedOutcome
      title: Second measurement
      type: Variable
      suggested: [continuous]
      permitted: [numeric]
      default:
    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
    - name: showPlot
      title: Visualisation
      type: Bool
      default: true
    - name: reportStyle
      title: Report style
      type: List
      options:
        - { name: apa7, title: APA 7th edition }
        - { name: plain, title: Plain English / teaching explanation }
        - { name: journal, title: Journal style }
        - { name: dissertation, title: Dissertation style }
      default: apa7
    - name: reportFormat
      title: Report format
      type: List
      options:
        - { name: short, title: Short results sentence }
        - { name: paragraph, title: Full results paragraph }
        - { name: bullets, title: Bullet-point interpretation }
        - { name: table_paragraph, title: Table plus paragraph }
        - { name: copy_ready, title: Copy-ready report block }
      default: paragraph
    - name: reportTone
      title: Detail level
      type: List
      options:
        - { name: concise, title: Concise }
        - { name: student_friendly, title: Student-friendly }
        - { name: detailed, title: Detailed }
        - { name: critical, title: Critical / publication-focused }
      default: student_friendly
    - { name: reportTable, title: Generate APA results table, type: Bool, default: false }
    - name: reportTableDetail
      title: Table detail
      type: List
      options:
        - { name: compact, title: APA compact }
        - { name: detailed, title: APA detailed }
      default: compact
    - name: reportDescriptives
      title: Descriptive statistics
      type: Bool
      default: true
    - name: reportAssumptions
      title: Assumption checks
      type: Bool
      default: true
    - { name: reportStatistic, title: Test statistic, type: Bool, default: true }
    - { name: reportDf, title: Degrees of freedom, type: Bool, default: true }
    - { name: reportP, title: Exact p value, type: Bool, default: true }
    - name: reportEffect
      title: Effect size
      type: Bool
      default: true
    - name: reportCI
      title: Confidence intervals
      type: Bool
      default: true
    - name: reportInterpretation
      title: Interpretation of findings
      type: Bool
      default: true
    - name: reportCautions
      title: Cautions or assumption warnings
      type: Bool
      default: true
...
