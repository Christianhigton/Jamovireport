---
name: eduChiSquareGoodness
title: Guided Chi-Square Goodness-of-Fit
menuGroup: jReport
menuSubgroup: Frequencies
menuTitle: Chi-Square Goodness-of-Fit
version: '1.0.0'
jas: '1.2'
description:
    references:
        - jReport
        - effectsize
    main: >
        Compare observed categorical frequencies with an expected distribution,
        with assumption guidance and report-ready explanation.
options:
    - { name: data, type: Data }
    - name: variable
      title: Categorical variable
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor]
    - name: counts
      title: Counts (optional)
      type: Variable
      suggested: [continuous]
      permitted: [numeric]
      default: null
    - { name: expectedRatios, title: 'Expected ratios: comma-separated (blank = equal)', type: String, default: '' }
    - name: reportStyle
      title: Report style
      type: List
      options:
        - { name: apa7, title: APA 7th edition }
        - { name: plain, title: Plain English / teaching explanation }
        - { name: journal, title: Journal style }
        - { name: dissertation, title: Dissertation style }
      default: apa7
    - name: reportFormat
      title: Report format
      type: List
      options:
        - { name: short, title: Short results sentence }
        - { name: paragraph, title: Full results paragraph }
        - { name: bullets, title: Bullet-point interpretation }
        - { name: table_paragraph, title: Table plus paragraph }
        - { name: copy_ready, title: Copy-ready report block }
      default: paragraph
    - name: reportTone
      title: Detail level
      type: List
      options:
        - { name: concise, title: Concise }
        - { name: student_friendly, title: Student-friendly }
        - { name: detailed, title: Detailed }
        - { name: critical, title: Critical / publication-focused }
      default: student_friendly
    - { name: reportTable, title: Generate APA results table, type: Bool, default: false }
    - name: reportTableDetail
      title: Table detail
      type: List
      options:
        - { name: compact, title: APA compact }
        - { name: detailed, title: APA detailed }
      default: compact
    - { name: reportDescriptives, title: Observed and expected counts, type: Bool, default: true }
    - { name: reportAssumptions, title: Expected-count check, type: Bool, default: true }
    - { name: reportStatistic, title: Test statistic, type: Bool, default: true }
    - { name: reportDf, title: Degrees of freedom, type: Bool, default: true }
    - { name: reportP, title: Exact p value, type: Bool, default: true }
    - { name: reportEffect, title: Cohen's w, type: Bool, default: true }
    - { name: reportCI, title: Confidence intervals where available, type: Bool, default: true }
    - { name: reportInterpretation, title: Interpretation of findings, type: Bool, default: true }
    - { name: reportCautions, title: Cautions or assumption warnings, type: Bool, default: true }
...
