---
name: eduAncova
title: Guided ANCOVA
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    suggested: [continuous, nominal, ordinal]
    persistentItems: false
    children:
      - type: TargetLayoutBox
        label: Outcome
        children: [{ type: VariablesListBox, name: outcome, maxItemCount: 1, isTarget: true }]
      - type: TargetLayoutBox
        label: Fixed Factors
        children: [{ type: VariablesListBox, name: factors, isTarget: true }]
      - type: TargetLayoutBox
        label: Covariates
        children: [{ type: VariablesListBox, name: covariates, isTarget: true }]
  - type: CollapseBox
    label: Analysis
    collapsed: false
    children:
      - { type: TextBox, name: ciWidth, format: number }
      - { type: CheckBox, name: showPlot }
  - type: CollapseBox
    label: Reporting
    collapsed: true
    children:
      - { type: ComboBox, name: reportStyle }
      - { type: ComboBox, name: reportFormat }
      - { type: ComboBox, name: reportTone }
      - { type: CheckBox, name: reportDescriptives }
      - { type: CheckBox, name: reportAssumptions }
      - { type: CheckBox, name: reportStatistic }
      - { type: CheckBox, name: reportDf }
      - { type: CheckBox, name: reportP }
      - { type: CheckBox, name: reportEffect }
      - { type: CheckBox, name: reportCI }
      - { type: CheckBox, name: reportInterpretation }
      - { type: CheckBox, name: reportCautions }
...
