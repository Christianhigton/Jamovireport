---
name: eduCorrelation
title: Guided Correlation
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    stretchFactor: 1
    suggested: [continuous, ordinal]
    persistentItems: false
    children:
      - type: TargetLayoutBox
        label: First Variable
        children: [{ type: VariablesListBox, name: x, maxItemCount: 1, isTarget: true }]
      - type: TargetLayoutBox
        label: Second Variable
        children: [{ type: VariablesListBox, name: y, maxItemCount: 1, isTarget: true }]
  - type: CollapseBox
    label: Analysis
    collapsed: false
    children:
      - { type: ComboBox, name: method }
      - { type: TextBox, name: ciWidth, format: number }
      - { type: CheckBox, name: showPlot }
  - type: CollapseBox
    label: Reporting
    collapsed: true
    children:
      - { type: ComboBox, name: reportStyle }
      - { type: ComboBox, name: reportFormat }
      - { type: ComboBox, name: reportTone }
      - { type: CheckBox, name: reportTable }
      - { type: ComboBox, name: reportTableDetail, enable: (reportTable) }
      - { type: CheckBox, name: reportDescriptives }
      - { type: CheckBox, name: reportAssumptions }
      - { type: CheckBox, name: reportStatistic }
      - { type: CheckBox, name: reportDf }
      - { type: CheckBox, name: reportP }
      - { type: CheckBox, name: reportEffect }
      - { type: CheckBox, name: reportCI }
      - { type: CheckBox, name: reportInterpretation }
      - { type: CheckBox, name: reportCautions }
...
