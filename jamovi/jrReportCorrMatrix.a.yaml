---
name: jrReportCorrMatrix
title: Automatic Report for Correlation Matrix
menuGroup: Report Add-ons
version: '1.0.0'
jas: '1.2'
description:
    references:
        - RCore
        - jReport
        - jmvcore
        - effectsize
options:
    - { name: data, type: Data }
    - name: pAdjustment
      title: Multiple-comparison adjustment
      type: List
      options:
        - { name: holm, title: Holm (recommended) }
        - { name: bonferroni, title: Bonferroni }
        - { name: bh, title: Benjamini-Hochberg false discovery rate }
        - { name: none, title: None }
      default: holm
      description: >
          When several correlations address the same overall research question,
          adjusting the p-values can control the increased risk of false-positive
          findings. Holm is recommended for most confirmatory analyses because it
          controls the familywise Type I error rate and is generally less
          conservative than Bonferroni. Benjamini-Hochberg controls the expected
          false discovery rate and may be useful for large exploratory correlation
          sets. Apply the adjustment across one planned family of correlation tests.
...
