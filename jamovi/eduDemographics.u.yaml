---
name: eduDemographics
title: Demographic Table
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    stretchFactor: 1
    persistentItems: true
    children:
      - type: TargetLayoutBox
        label: Table Variables
        children:
          - type: VariablesListBox
            name: tableVariables
            isTarget: true
      - type: TargetLayoutBox
        label: Paragraph Variables
        children:
          - type: VariablesListBox
            name: paragraphVariables
            isTarget: true
  - type: CollapseBox
    label: Output Options
    collapsed: false
    children:
      - { type: CheckBox, name: showTable }
      - { type: CheckBox, name: showParagraph }
      - type: TextBox
        name: tableTitle
        format: string
        stretchFactor: 1
  - type: CollapseBox
    label: Continuous Variable Statistics
    collapsed: false
    children:
      - { type: CheckBox, name: statMean }
      - { type: CheckBox, name: statSD }
      - { type: CheckBox, name: statMedian }
      - { type: CheckBox, name: statIQR }
      - { type: CheckBox, name: statMin }
      - { type: CheckBox, name: statMax }
      - { type: CheckBox, name: statRange }
      - { type: CheckBox, name: statContMissing }
  - type: CollapseBox
    label: Categorical Variable Statistics
    collapsed: false
    children:
      - { type: CheckBox, name: statN }
      - { type: CheckBox, name: statPct }
      - { type: CheckBox, name: statCatMissing }
  - type: CollapseBox
    label: Additional Table Rows
    collapsed: true
    children:
      - { type: TextBox, name: customRow1Char, format: string }
      - { type: TextBox, name: customRow1Val, format: string }
      - { type: TextBox, name: customRow1Pct, format: string }
      - { type: TextBox, name: customRow1Note, format: string }
      - { type: TextBox, name: customRow2Char, format: string }
      - { type: TextBox, name: customRow2Val, format: string }
      - { type: TextBox, name: customRow2Pct, format: string }
      - { type: TextBox, name: customRow2Note, format: string }
      - { type: TextBox, name: customRow3Char, format: string }
      - { type: TextBox, name: customRow3Val, format: string }
      - { type: TextBox, name: customRow3Pct, format: string }
      - { type: TextBox, name: customRow3Note, format: string }
      - { type: TextBox, name: customRow4Char, format: string }
      - { type: TextBox, name: customRow4Val, format: string }
      - { type: TextBox, name: customRow4Pct, format: string }
      - { type: TextBox, name: customRow4Note, format: string }
      - { type: TextBox, name: customRow5Char, format: string }
      - { type: TextBox, name: customRow5Val, format: string }
      - { type: TextBox, name: customRow5Pct, format: string }
      - { type: TextBox, name: customRow5Note, format: string }
  - type: CollapseBox
    label: Reporting
    collapsed: true
    children:
      - { type: CheckBox, name: showOmitNote }
      - { type: CheckBox, name: showBestPractices }
...
