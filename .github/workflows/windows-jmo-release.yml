name: Build Windows jamovi module

on:
  workflow_dispatch:
  push:
    branches:
      - codex/manova-report-followups
    paths:
      - '.github/workflows/windows-jmo-release.yml'

permissions:
  contents: write

env:
  JAMOVI_VERSION: 2.7.24.0
  RELEASE_TAG: v0.1.0.9010
  JMO_NAME: JamoviReport_0.1.0.9010_windows_x64_jamovi-2.7.jmo

jobs:
  build-windows:
    name: Windows x64 / jamovi 2.7
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download jamovi Windows archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "jamovi-windows.zip"
          curl.exe --location --fail --retry 3 --output $zip "https://archives.jamovi.org/jamovi-$env:JAMOVI_VERSION-win-x64.zip"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) {
            throw "Unable to download the official jamovi Windows archive."
          }
          "JAMOVI_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate jamovi archive layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$env:JAMOVI_ZIP")
          try {
            if ($null -eq $archive.GetEntry("jamovi/bin/jamovi.exe")) {
              throw "The official Windows archive does not contain jamovi/bin/jamovi.exe."
            }
            if ($null -eq $archive.GetEntry("jamovi/Frameworks/R/bin/x64/R.exe")) {
              throw "The official Windows archive does not contain its R executable."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Extract jamovi runtime markers
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "jamovi-windows"
          $requiredEntries = @(
            "jamovi/bin/jamovi.exe",
            "jamovi/Frameworks/R/bin/x64/R.exe"
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$env:JAMOVI_ZIP")
          try {
            foreach ($requiredEntry in $requiredEntries) {
              $entry = $archive.GetEntry($requiredEntry)
              $destination = Join-Path $extract $requiredEntry
              New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Extract jamovi R build libraries
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "jamovi-windows"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $prefixes = @(
            "jamovi/Frameworks/R/",
            "jamovi/Resources/modules/base/R/",
            "jamovi/Resources/modules/jmv/R/"
          )
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$env:JAMOVI_ZIP")
          try {
            foreach ($entry in $archive.Entries) {
              $required = $false
              foreach ($prefix in $prefixes) {
                $required = $required -or $entry.FullName.StartsWith($prefix)
              }
              if (-not $required -or $entry.FullName.EndsWith("/")) {
                continue
              }
              $relative = $entry.FullName.Replace("/", [System.IO.Path]::DirectorySeparatorChar)
              $destination = Join-Path $extract $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Register jamovi build home
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "jamovi-windows"
          $home = Join-Path $extract "jamovi"
          if (-not (Test-Path (Join-Path $home "bin\jamovi.exe"))) {
            throw "The jamovi runtime was not extracted from the official Windows archive."
          }
          if (-not (Test-Path (Join-Path $home "Frameworks\R\bin\x64\R.exe"))) {
            throw "The jamovi R runtime was not extracted from the official Windows archive."
          }
          "JAMOVI_HOME=$home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Using jamovi at $home"

      - name: Install jamovi compiler
        run: npm install --global git+https://github.com/jamovi/jamovi-compiler.git

      - name: Build Windows .jmo
        shell: pwsh
        run: |
          jmc --build "." --home "$env:JAMOVI_HOME" --assume-app-version "2.7.24" --jmo "$env:JMO_NAME"
          if (-not (Test-Path "$env:JMO_NAME")) {
            throw "The Windows .jmo build was not created."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JamoviReport-windows-x64-jamovi-2.7
          path: ${{ env.JMO_NAME }}

      - name: Publish Windows prerelease asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "$env:JMO_NAME#Windows x64 (jamovi 2.7)"
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$asset" --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          else {
            gh release create "$env:RELEASE_TAG" "$asset" `
              --target "$env:GITHUB_SHA" `
              --title "JamoviReport 0.1.0.9010 (development build)" `
              --notes "Development build for sideloading in jamovi. This Windows x64 asset is built for the jamovi 2.7 series. Download the .jmo file and install it using jamovi's sideload module option." `
              --prerelease `
              --repo "$env:GITHUB_REPOSITORY"
          }
